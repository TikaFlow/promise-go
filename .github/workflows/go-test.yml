name: Tests

on:
  push:
    branches:
      - "main"
    tags:
      - "!*"
  pull_request:
    branches:
      - "main"

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run tests
        run: go test -v ./...